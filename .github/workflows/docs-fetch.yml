name: Docs fetch (temporary)
on:
  push:
    branches: [claude/modest-ritchie-l11wnt]
    paths: [.github/workflows/docs-fetch.yml]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Wordstat API docs
        run: |
          for u in \
            https://yandex.ru/support2/wordstat/ru/content/api-structure.md \
            https://yandex.ru/support2/wordstat/ru/content/api-wordstat.md \
            https://yandex.com/support2/wordstat/en/content/api-structure.md \
            https://yandex.com/support2/wordstat/en/content/api-wordstat.md; do
            echo "===== $u"
            curl -sSL --max-time 30 -A "Mozilla/5.0" "$u" | head -c 60000
            echo
          done
      - name: Probe API endpoint
        run: |
          curl -sS -i --max-time 20 -X POST https://api.wordstat.yandex.net/v1/topRequests -H 'Content-Type: application/json' -d '{"phrase":"финтех"}' | head -30 || true
