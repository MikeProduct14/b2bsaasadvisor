# re-run 2026-10-27T11:41Z
name: Domain diagnostics

on:
  push:
    branches:
      - claude/modest-ritchie-l11wnt

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages || true

      - name: Install github-pages-health-check
        run: sudo gem install --no-document github-pages-health-check 2>&1 | tail -3

      - name: Run GitHub's own DNS health check
        run: |
          cat > check.rb <<'RUBY'
          require "github-pages-health-check"
          require "json"
          puts "gem version: #{GitHubPages::HealthCheck::VERSION}"
          %w[www.productmike.ru productmike.ru].each do |host|
            %i[default authoritative public].each do |ns|
              begin
                d = GitHubPages::HealthCheck::Domain.new(host, nameservers: ns)
                h = d.to_hash
                puts "===== #{host} (nameservers: #{ns})"
                puts "valid?=#{d.valid?} reason=#{d.reason.class}: #{d.reason&.message}"
                puts "dns=" + (d.dns || []).map { |r| "#{r.type} #{r.respond_to?(:address) ? r.address : (r.respond_to?(:cname) ? r.cname : r.rdata)}" }.join(", ")
                puts JSON.pretty_generate(h.select { |k, _| %i[a_record? cname_record? valid_domain? apex_domain? should_be_a_record? cname_to_github_user_domain? pointed_to_github_pages_ip? non_github_pages_ip_present? enforces_https? https? https_error dns_resolves? proxied? cloudflare_ip? old_ip_address? mx_records_present? valid_domain? cname].include?(k) })
              rescue => e
                puts "===== #{host} (nameservers: #{ns}) ERROR #{e.class}: #{e.message}"
              end
            end
          end
          RUBY
          ruby check.rb

      - name: TLS cert
        run: |
          echo | timeout 15 openssl s_client -connect www.productmike.ru:443 -servername www.productmike.ru 2>/dev/null | openssl x509 -noout -subject -dates || true
          dig +noall +answer www.productmike.ru A @8.8.8.8
          dig +noall +answer productmike.ru A @8.8.8.8
