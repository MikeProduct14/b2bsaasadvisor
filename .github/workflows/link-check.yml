name: Link check (temporary)

on:
  push:
    branches:
      - claude/modest-ritchie-l11wnt

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate product URLs
        run: |
          for u in \
            https://compliance-mfo.vercel.app/ \
            https://mkk-fz-115.vercel.app/ \
            https://mkk-fz-115-mikeproduct14.vercel.app/ \
            https://telegram-mini.vercel.app/ \
            https://mikeproduct14.github.io/moleculai-model-guide/ \
            https://mikeproduct14.github.io/roadmap-app/ \
            https://mikeproduct14.github.io/test-projects/ \
            https://mikeproduct14.github.io/test-projects/stm-chemistry-landing/ \
            https://mikeproduct14.github.io/test-projects/chess-coach/ \
            https://mikeproduct14.github.io/mikhail-eroshkin-portfolio/ \
            https://vibecodify.onrender.com/vibecodify.html \
            https://moleculai.ru/ \
            https://moleculai.ru/role/psychologist \
            https://moleculai.ru/model/claude \
            https://moleculai.ru/model/gemini \
            https://moleculai.ru/text/generation \
            https://moleculai.ru/b2b ; do
            code=$(curl -sS -m 25 -L -o page.html -w '%{http_code} %{url_effective}' "$u" 2>&1 | tail -1)
            title=$(grep -ioE '<title>[^<]*</title>' page.html 2>/dev/null | head -1)
            echo "$u -> $code | $title"
          done
      - name: MoleculAI sitemap
        run: |
          curl -sS -m 25 -L https://moleculai.ru/sitemap.xml -o sm.xml || true
          head -c 400 sm.xml; echo
          echo "total urls: $(grep -o '<loc>' sm.xml | wc -l)"
          for p in role model text photo pictures video blog; do echo "/$p/: $(grep -oE "<loc>[^<]*/$p/[^<]*</loc>" sm.xml | wc -l)"; done
          grep -oE '<loc>[^<]*/role/[^<]*</loc>' sm.xml | head -20
          grep -oE '<loc>[^<]*sitemap[^<]*</loc>' sm.xml | head
