name: Deploy Supabase function

# Выкладывает функцию заявок (supabase/functions/server) в Supabase при изменениях в main
# и передаёт ей секреты Telegram-бота. Ручной запуск (Actions → Deploy Supabase function →
# Run workflow) делает то же самое и присылает тестовое сообщение в Telegram.
# Секреты репозитория: SUPABASE_ACCESS_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — см. LEADS.md.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

env:
  PROJECT_REF: bxokwgejreqeraxlhwqd

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Нет секрета SUPABASE_ACCESS_TOKEN. Создайте токен в Supabase (Account → Access Tokens) и добавьте его в Settings → Secrets and variables → Actions. Инструкция — LEADS.md."
            exit 1
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Нет TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID: функция выложится, но уведомления о заявках не придут."
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Set Telegram secrets
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          umask 077
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" > "$RUNNER_TEMP/telegram.env"
          supabase secrets set --env-file "$RUNNER_TEMP/telegram.env" --project-ref "$PROJECT_REF"
          rm -f "$RUNNER_TEMP/telegram.env"

      - name: Deploy function
        run: supabase functions deploy make-server-52ecca80 --project-ref "$PROJECT_REF" --use-api

      - name: Send test message
        if: github.event_name == 'workflow_dispatch' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          response=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Бот подключён: заявки с www.productmike.ru будут приходить сюда.")
          if ! echo "$response" | grep -q '"ok":true'; then
            echo "::error::Telegram не принял сообщение: $(echo "$response" | sed 's/"description":/описание: /')"
            echo "::error::Проверьте TELEGRAM_CHAT_ID и что вы написали боту /start."
            exit 1
          fi
          echo "Тестовое сообщение отправлено."
