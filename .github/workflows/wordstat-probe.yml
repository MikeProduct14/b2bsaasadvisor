name: Wordstat probe (temporary)
on:
  push:
    branches: [claude/modest-ritchie-l11wnt]
    paths: [.github/workflows/wordstat-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe phrases
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: |
          node scripts/wordstat.mjs \
            "автоматизация работы с самозанятыми" "автоматизация выплат самозанятым" "сервис выплат самозанятым" \
            "автоматизация 115-фз" "автоматизация комплаенса" "ии в комплаенсе" "aml система" "программа для 115-фз" \
            "автоматическая проверка контрагентов" "проверка контрагентов api" "мониторинг контрагентов" "проверка контрагентов в 1с" \
            "автоматизация приема платежей" "интеграция платежей с 1с" "автоматизация сверки платежей" "платежный агрегатор для юрлиц" \
            "ии в финтехе" "искусственный интеллект в банках" "антифрод" "распознавание документов нейросеть" "автоматизация бухгалтерии" \
            "автоматизация финансового отдела" "ии для бухгалтерии"
